<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Santa Eulalia · Gestor del equipo</title>
  <script src="https://tailwindcss.com"></script>
  <style>
    html, body { margin: 0; padding: 0; background: #0F2A1E; }
    #root { min-height: 100vh; }
  </style>
  
  <!-- Cargamos Firebase desde la red oficial de Google -->
  <script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getDatabase, ref, set, onValue } from "https://gstatic.com";

    // 1. CONFIGURACIÓN COMPLETA DE TU PROYECTO SANTA EULALIA
    const firebaseConfig = {
      apiKey: "AIzaSyC1Ouz9TxjqBrH5YgA8igVqz3N_g1fmFt4",
      authDomain: "santa-eulalia-gestor.firebaseapp.com",
      databaseURL: "https://firebaseio.com",
      projectId: "santa-eulalia-gestor",
      storageBucket: "santa-eulalia-gestor.firebasestorage.app",
      messagingSenderId: "420519463966",
      appId: "1:420519463966:web:25474de313ed64a8bb720f"
    };

    // Inicializamos Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const equipoRef = ref(db, 'datos_equipo');

    // Variable de control para evitar bucles infinitos de guardado
    let bloqueadoPorSincronizacion = false;

    // 2. ESCUCHA EN TIEMPO REAL (NUBE -> NAVEGADOR)
    // Cuando tú o cualquier jugador cambie algo en la app, se actualiza en todos los móviles al instante
    onValue(equipoRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        bloqueadoPorSincronizacion = true;
        let huboCambios = false;

        Object.keys(data).forEach(key => {
          if (localStorage.getItem(key) !== data[key]) {
            localStorage.setItem(key, data[key]);
            huboCambios = true;
          }
        });

        // Si hay cambios de otro jugador, recargamos discretamente la vista para que React los pinte
        if (huboCambios) {
          console.log("¡Datos del equipo actualizados desde la nube!");
          // Forzamos un pequeño evento click fantasma en la pantalla para obligar a React a refrescar sus listas
          document.body.dispatchEvent(new Event('click', { bubbles: true }));
        }
        
        setTimeout(() => { bloqueadoPorSincronizacion = false; }, 600);
      }
    });

    // 3. SUBIDA AUTOMÁTICA (NAVEGADOR -> NUBE)
    // Recopila tus listas locales de jugadores, partidos, etc., y las sube a la base de datos colectiva
    function subirDatosALaNube() {
      if (bloqueadoPorSincronizacion) return;
      
      const datosLocales = {};
      
      // Filtramos las llaves importantes del LocalStorage que genera la app para no saturar la red
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        // Excluimos textos temporales incompletos de los formularios para subir solo las listas confirmadas
        if (!key.startsWith('_se_input_')) { 
          datosLocales[key] = localStorage.getItem(key);
        }
      }

      if (Object.keys(datosLocales).length > 0) {
        set(equipoRef, datosLocales)
          .then(() => console.log("Sincronizado en la nube para todo el equipo."))
          .catch((error) => console.error("Error al sincronizar con Firebase:", error));
      }
    }

    // Disparadores automáticos: guarda cada vez que tocas la pantalla o cambias de pestaña
    document.addEventListener('click', () => setTimeout(subirDatosALaNube, 400));
    document.addEventListener('change', () => setTimeout(subirDatosALaNube, 400));
    window.addEventListener('beforeunload', subirDatosALaNube);
    setInterval(subirDatosALaNube, 6000); // Respaldo periódico automático cada 6 segundos
  </script>
</head>
<body>
  <div id="root"></div>
  <script src="app.bundle.js"></script>
</body>
</html>
