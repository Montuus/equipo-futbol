<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Santa Eulalia · Gestor de Equipo</title>
  
  <!-- CDN de Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    /* Estilos base del sistema */
    html, body {
      margin: 0;
      padding: 0;
      background-color: #0F2A1E; /* Verde corporativo de Santa Eulalia */
    }
    #root {
      min-height: 100vh;
    }
  </style>

  <script>
    /**
     * --- MOTOR DE PERSISTENCIA AUTOMÁTICA (LOCALSTORAGE) ---
     * Diseñado para interceptar, respaldar y recuperar los estados de la aplicación de forma transparente.
     */
    (function() {
      const STORAGE_PREFIX = '_se_';
      const storageKeys = ['jugadores', 'partidos', 'entrenamientos', 'asistencias', 'resultados', 'equipo_data'];
      const localBackup = {};

      // 1. Carga previa de datos guardados en el navegador
      storageKeys.forEach(key => {
        const savedData = localStorage.getItem(STORAGE_PREFIX + key);
        if (savedData) {
          try {
            localBackup[key] = JSON.parse(savedData);
          } catch (error) {
            console.error(`Error al parsear los datos de: ${key}`, error);
          }
        }
      });

      // Expositor seguro para el estado inicial de React
      window.__PRELOADED_STATE__ = localBackup;

      // 2. Respaldo masivo preventivo al cerrar o refrescar la pestaña
      window.addEventListener('beforeunload', () => {
        storageKeys.forEach(key => {
          if (window[key] !== undefined && window[key] !== null) {
            localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(window[key]));
          }
        });
      });

      // 3. Sistema de guardado periódico (Intervalo de seguridad cada 2 segundos)
      setInterval(() => {
        storageKeys.forEach(key => {
          // Guarda variables globales sincronizadas por la aplicación
          if (window[key] !== undefined && window[key] !== null) {
            localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(window[key]));
          }
        });

        // Persistencia activa para entradas de texto, formularios y selectores abiertos
        const formInputs = document.querySelectorAll('input, select, textarea');
        formInputs.forEach(input => {
          const inputId = input.id || input.name;
          if (inputId) {
            localStorage.setItem(`${STORAGE_PREFIX}input_${inputId}`, input.value);
          }
        });
      }, 2000);

      // 4. Restauración automática de formularios tras la carga del DOM
      document.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          const formInputs = document.querySelectorAll('input, select, textarea');
          formInputs.forEach(input => {
            const inputId = input.id || input.name;
            const savedValue = localStorage.getItem(`${STORAGE_PREFIX}input_${inputId}`);
            
            if (savedValue !== null) {
              input.value = savedValue;
              // Dispara el evento nativo para que React detecte el cambio de valor
              input.dispatchEvent(new Event('input', { bubbles: true }));
            }
          });
        }, 500);
      });
    })();
  </script>
</head>
<body class="antialiased text-slate-100">

  <!-- Contenedor principal de la aplicación React / Claude App -->
  <div id="root"></div>

  <!-- Script empaquetado de la aplicación -->
  <script src="app.bundle.js"></script>

</body>
</html>
