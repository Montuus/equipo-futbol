<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Santa Eulalia · Gestor del equipo</title>
  <script src="https://tailwindcss.com"></script>
  <style>
    html, body { margin: 0; padding: 0; background: #0F2A1E; }
    #root { min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <!-- Primero cargamos tu aplicación para que el diseño se pinte a la perfección -->
  <script src="app.bundle.js"></script>

  <!-- Después cargamos Firebase en segundo plano sin interferir en los estilos -->
  <script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getDatabase, ref, set, onValue } from "https://gstatic.com";

    // Configuración de tu proyecto Santa Eulalia
    const firebaseConfig = {
      apiKey: "AIzaSyC1Ouz9TxjqBrH5YgA8igVqz3N_g1fmFt4",
      authDomain: "://firebaseapp.com",
      databaseURL: "https://firebaseio.com",
      projectId: "santa-eulalia-gestor",
      storageBucket: "santa-eulalia-gestor.firebasestorage.app",
      messagingSenderId: "420519463966",
      appId: "1:420519463966:web:25474de313ed64a8bb720f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const equipoRef = ref(db, 'datos_equipo');

    let bloqueadoPorSincronizacion = false;

    // Escucha en tiempo real (Nube -> Navegador)
    onValue(equipoRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        bloqueadoPorSincronizacion = true;
        let huboCambios = false;

        Object.keys(data).forEach(key => {
          // Ignoramos por completo cualquier estado visual o pestaña activa para no romper el diseño
          if (key.toLowerCase().includes('tab') || key.toLowerCase().includes('active') || key.toLowerCase().includes('vista')) return;

          if (localStorage.getItem(key) !== data[key]) {
            localStorage.setItem(key, data[key]);
            huboCambios = true;
          }
        });

        // Si hay cambios reales de jugadores, avisamos a la interfaz de forma segura
        if (huboCambios) {
          console.log("¡Datos sincronizados desde la nube!");
          // Forzamos un renderizado seguro disparando un evento nativo
          window.dispatchEvent(new Event('resize'));
        }
        
        setTimeout(() => { bloqueadoPorSincronizacion = false; }, 800);
      }
    });

    // Subida de datos (Navegador -> Nube)
    function subirDatosALaNube() {
      if (bloqueadoPorSincronizacion) return;
      
      const datosLocales = {};
      
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        // Filtramos para subir solo listas puras, no configuraciones del menú
        if (!key.startsWith('_se_input_') && !key.toLowerCase().includes('tab') && !key.toLowerCase().includes('active') && !key.toLowerCase().includes('vista')) { 
          datosLocales[key] = localStorage.getItem(key);
        }
      }

      if (Object.keys(datosLocales).length > 0) {
        set(equipoRef, datosLocales).catch((err) => console.error(err));
      }
    }

    // Guardar solo cuando se interactúe con formularios o botones de acción
    document.addEventListener('submit', () => setTimeout(subirDatosALaNube, 500));
    document.addEventListener('click', (e) => {
      if (e.target.closest('button')) setTimeout(subirDatosALaNube, 500);
    });
    window.addEventListener('beforeunload', subirDatosALaNube);
    setInterval(subirDatosALaNube, 10000); // Respaldo cada 10 segundos
  </script>
</body>
</html>
